version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: docker
    directory: /docker/php
    schedule: { interval: weekly }
    target-branch: develop
